<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore interiors, architecture, objects and printed matter in the Studio North portfolio."
    />
    <title>Studio North — Folio3D</title>
  </head>
  <body data-publication="portfolio">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-nav">
      <a class="wordmark" href="../index.html">Folio<span>3D</span></a>
      <nav aria-label="Demo navigation">
        <a href="../index.html#demos">All demos</a>
        <a href="./catalog.html">Catalog</a>
        <a href="./bookshelf.html">Reading room</a>
      </nav>
    </header>
    <main class="publication-page" id="main-content" tabindex="-1">
      <section class="studio-layout" aria-label="Studio North, selected work">
        <div class="studio-intro">
          <p class="edition-line">Design portfolio <span>/</span> 2026</p>
          <h1>Studio <br />North</h1>
          <p>Interiors, architecture and printed matter from a fictional design practice.</p>
        </div>
        <div class="studio-index">
          <h2 class="edition-line">Project index</h2>
          <div
            class="section-buttons studio-sections"
            id="section-buttons"
            role="group"
            aria-label="Portfolio projects"
          ></div>
        </div>
        <div class="studio-reader">
          <div class="studio-reader-bar">
            <span id="publication-status" role="status">Opening portfolio…</span>
            <button id="demo-lightbox" class="lightbox-opener" type="button" disabled>
              Open lightbox <span aria-hidden="true">↗</span>
            </button>
          </div>
          <div id="demo-book" class="demo-book"></div>
          <div class="reader-caption">
            <p id="project-note" aria-live="polite">Opening selected work…</p>
            <button id="retry" type="button" hidden>Try again</button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <a class="wordmark" href="../index.html">Folio<span>3D</span></a>
      <nav aria-label="Footer navigation">
        <a href="../README.txt">Documentation</a>
        <a href="../LICENSE.txt">MIT license</a>
      </nav>
    </footer>
    <script type="module" src="./shared.ts"></script>
  </body>
</html>
